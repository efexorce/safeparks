version: "3.9"

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: safeparks-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: safeparks
      POSTGRES_PASSWORD: safeparks_secure_pass
      POSTGRES_DB: safeparks
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-timescale.sql:/docker-entrypoint-initdb.d/init-timescale.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safeparks"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: safeparks-redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: safeparks-mqtt
    restart: unless-stopped
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mqtt_data:/mosquitto/data
      - mqtt_logs:/mosquitto/log
    ports:
      - "1883:1883"
      - "9001:9001"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: safeparks-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: safeparks-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: safeparks-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_USER: safeparks
      POSTGRES_PASSWORD: safeparks_secure_pass
      POSTGRES_DB: safeparks
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: 1883
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8000:8000"
    volumes:
      - footage_data:/app/footage
      - thumbnails_data:/app/thumbnails

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: safeparks-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

  nginx:
    image: nginx:alpine
    container_name: safeparks-nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"

volumes:
  postgres_data:
  redis_data:
  mqtt_data:
  mqtt_logs:
  zookeeper_data:
  kafka_data:
  footage_data:
  thumbnails_data:
