apiVersion: apps/v1
kind: Deployment
metadata:
  name: safeparks-backend
  namespace: safeparks
  labels:
    app: safeparks-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: safeparks-backend
  template:
    metadata:
      labels:
        app: safeparks-backend
    spec:
      containers:
        - name: backend
          image: safeparks/backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: POSTGRES_SERVER
              valueFrom:
                secretKeyRef:
                  name: safeparks-secrets
                  key: postgres-host
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: safeparks-secrets
                  key: postgres-password
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: safeparks-secrets
                  key: secret-key
            - name: MQTT_BROKER_HOST
              value: "mosquitto-service"
            - name: REDIS_HOST
              value: "redis-service"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-service:9092"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: safeparks
spec:
  selector:
    app: safeparks-backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
